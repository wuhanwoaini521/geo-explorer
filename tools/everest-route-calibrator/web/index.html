<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Everest · 珠峰实景校准器</title>
  <link rel="stylesheet" href="viewer.css" />
</head>
<body>
  <header>
    <h1>Everest Route Calibrator <span class="tag">实景标注 → 求解 → 验证 → 投影</span></h1>
    <div class="row">
      <select id="scene-select"></select>
      <button id="run-btn">▶ 求解并投影</button>
      <button id="auto-marks-btn" title="把初始相机 guess 能投影到的每条地标一次性放入列表；然后人工逐次在真实峰顶单击，靠近引导圈自动吸附">⚡ 预标记</button>
      <button id="export-btn">↓ 导出 pixels.json</button>
      <button id="export-report-btn">↓ 导出 report.json</button>
      <label class="hint"><input type="checkbox" id="show-route" checked /> 叠加路线</label>
      <label class="hint"><input type="checkbox" id="show-wpts" checked /> waypoints</label>
    </div>
  </header>

  <main>
    <section id="stage">
      <img id="photo" class="hidden" alt="live 实景" />
      <canvas id="overlay"></canvas>
      <div id="loading">载入场景图片…</div>
    </section>

    <aside>
      <section>
        <h2>① 选地标（点击图内像素）</h2>
        <div id="catalog"></div>
        <p class="hint">先点 “⚡ 预标记” 一键放下全部引导圈；然后逐个核验：
          选亮左侧地标 → 在主图上其真实峰顶单击（靠近空心引导圈会自动吸附）。</p>
      </section>
      <section>
        <h2>② 标注点列表</h2>
        <ul id="marks"></ul>
      </section>
      <section>
        <h2>求解输出</h2>
        <pre id="result">（尚未运行）</pre>
      </section>
    </aside>
  </main>

  <script type="module" src="viewer.js"></script>
</body>
</html>
