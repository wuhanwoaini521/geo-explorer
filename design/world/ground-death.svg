<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <defs>
    <linearGradient id="x1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fa7bd"/>
      <stop offset="1" stop-color="#5a7392"/>
    </linearGradient>
    <linearGradient id="x2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b7390"/>
      <stop offset="1" stop-color="#33496b"/>
    </linearGradient>
    <linearGradient id="x3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4567"/>
      <stop offset="1" stop-color="#16233d"/>
    </linearGradient>
  </defs>

  <!-- 死亡地带：暗岩 + 枯雪冰坡 -->
  <path d="M0,680 C150,590 300,700 460,620 C580,560 690,650 750,580 L750,960 L0,960 Z"
