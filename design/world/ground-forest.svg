    <polygon points="120,530 190,530 156,410"/>
    <polygon points="150,520 230,520 190,400"/>
    <polygon points="320,470 400,470 362,350"/>
    <polygon points="500,500 570,500 536,390"/>
    <polygon points="640,440 710,440 676,330"/>
    <polygon points="250,800 320,800 284,700"/>
    <polygon points="560,760 640,760 600,670"/>
    <polygon points="660,660 730,660 694,580"/>
  </g>
  <g fill="#0d1f12">
