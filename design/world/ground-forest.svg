<svg xmlns="http://www.w3.org/2000/svg" width="750" height="1334" viewBox="0 0 750 1334">
  <defs>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7d55"/>
      <stop offset="1" stop-color="#3f5a38"/>
